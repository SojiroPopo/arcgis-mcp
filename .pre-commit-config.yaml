# pre-commit: lint + format + cegah secret ter-commit
# Catatan: ruff berjalan dengan --exit-zero (memperbaiki yang aman, melaporkan sisanya,
# TIDAK memblokir commit). Hapus --exit-zero setelah baseline temuan bersih.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(^|/)(\.venv|venv|node_modules)/|package-lock\.json$|\.min\.js$|\.secrets\.baseline$'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '\.(md|txt|csv|json)$'
